name: tests

on:
  push:
    branches: [main]
  pull_request:
  # The engine is followed at main: a daily run catches an engine change
  # that breaks this game, even on days nothing here changes.
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: pytest
